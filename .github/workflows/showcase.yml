name: Showcase interactions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftcn-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase:
    name: showcase (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            arguments: ''
          - name: iPad
            arguments: '--ipad'
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Exercise showcase workflows
        run: python3 Scripts/run-showcase.py --test --no-open ${{ matrix.arguments }}
      - name: Upload showcase results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftcn-showcase-${{ matrix.name }}
          path: |
            artifacts/showcase/*.log
            artifacts/showcase/*.json
            artifacts/showcase/*.xcresult/
