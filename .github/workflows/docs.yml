name: Documentation

on:
  push:
    branches: [main]
    paths: ['website/**', 'Components/**', 'Sources/SwiftCN/**', 'Scripts/generate-components.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'Components/**', 'Sources/SwiftCN/**', 'Scripts/generate-components.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftcn-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duo:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/duo.yml

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /swiftcn
      NEXT_PUBLIC_SITE_URL: https://cbethin.github.io
      NEXT_PUBLIC_DOCS_VERSION: ${{ github.sha }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: python3 ../Scripts/generate-components.py --check
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
      - run: npm run check:export
      - uses: actions/upload-artifact@v7
        with:
          name: swiftcn-docs-static
          path: website/out/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/out/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
