name: iPhone Duo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftcn-duo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duo:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Duo toolchain
        run: |
          mkdir -p artifacts/duo-sdk
          xcodebuild -version
          swift --version
          xcrun simctl list -j > artifacts/duo-sdk/simulators.json
          xcrun simctl help > artifacts/duo-sdk/simctl.txt
          xcrun simctl help ui > artifacts/duo-sdk/ui.txt 2>&1
          xcrun simctl io help > artifacts/duo-sdk/io.txt 2>&1 || true
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          for framework in SwiftUI SwiftUICore; do
            cp "$sdk/System/Library/Frameworks/$framework.framework/Modules/$framework.swiftmodule/arm64-apple-ios-simulator.swiftinterface" "artifacts/duo-sdk/$framework.swiftinterface"
          done
          cp "$DEVELOPER_DIR/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/XCUIAutomation.framework/Headers/XCUIDevice.h" artifacts/duo-sdk/XCUIDevice.h
      - uses: actions/upload-artifact@v7
        with:
          name: swiftcn-duo-sdk-${{ matrix.shard }}
          path: artifacts/duo-sdk/
      - name: Compile the Duo SDK integration
        run: bash Scripts/check-ios.sh
      - name: Install Duo runtime
        timeout-minutes: 15
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
          xcrun simctl list -j > artifacts/duo-sdk/simulators-with-duo.json
      - name: Capture the entire native catalog
        run: python3 Scripts/ios-visual-test.py capture local --components --duo --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: swiftcn-duo-evidence-${{ matrix.shard }}
          path: |
            artifacts/duo-sdk/
            artifacts/duo-components/
